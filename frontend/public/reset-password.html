<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — ARIA</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#060d17;color:#d9d4ce}
@media (prefers-color-scheme:light){body{background:#ebe7e1;color:#060d17}}
form{width:min(380px,92vw);padding:28px;border:1px solid rgba(217,212,206,.18);border-radius:18px}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;margin:0 0 6px}
p{opacity:.7;font-size:14px;margin:0 0 18px}
input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font:inherit}
input{border:1px solid rgba(217,212,206,.25);background:transparent;color:inherit;margin-bottom:12px}
button{border:0;background:#f0cb7b;color:#060d17;font-weight:600;cursor:pointer}
#m{margin-top:12px;font-size:14px;min-height:1.2em}
.err{color:#e07a6b}.ok{color:#7bc49a}
</style>
</head>
<body>
<form id="f">
  <h1>Choose a new password</h1>
  <p id="sub">Checking your reset link…</p>
  <input id="pw" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" disabled>
  <button id="b" type="submit" disabled>Update password</button>
  <div id="m" role="status"></div>
</form>
<script type="module">
import { sb, sessionUser } from "/auth.js";
const $ = (s) => document.querySelector(s);
const m = (t, c) => { $("#m").textContent = t; $("#m").className = c || ""; };
const ready = (ok) => { $("#pw").disabled = !ok; $("#b").disabled = !ok; $("#sub").textContent = ok ? "Enter and confirm your new password." : "This reset link is invalid or has expired. Request a new one from the login page."; };
sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") ready(true); });
setTimeout(async () => { if ($("#pw").disabled) ready(!!(await sessionUser())); }, 800);
$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#pw").value;
  if (pw.length < 8 || !/\d/.test(pw) || !/[A-Za-z]/.test(pw)) return m("Use at least 8 characters with letters and numbers.", "err");
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) return m(error.message, "err");
  m("Password updated. Taking you to ARIA…", "ok");
  setTimeout(() => location.replace("/app"), 900);
});
</script>
</body>
</html>
